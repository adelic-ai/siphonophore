apiVersion: audit.k8s.io/v1
kind: Policy
# Deliberately narrower than AgentWatch's own demo/k8s/audit-policy.yaml: this experiment only
# needs to know that a `pods` API call happened, by whom, and whether the API server accepted it --
# agentwatch.groundtruth.k8s_audit.parse_lines() never reads request/response bodies (confirmed by
# reading its source directly), so RequestResponse-level capture (full object bodies, including
# labels) buys nothing here. Metadata level (who/what/when/result, no body) is sufficient and
# cheaper. Everything else is dropped (level: None) to keep the log free of unrelated noise
# (kube-system bootstrap traffic, etc.) -- see README.md's "Why Metadata, not RequestResponse".
rules:
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods"]
  - level: None
