[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siphonophore"
version = "0.0.1"
description = "Real per-node OS identity, provisioning, and check-in for Strands multi-agent orchestrators."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["siphonophore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
